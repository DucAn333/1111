name: Playwright Tests

on:
  workflow_dispatch:

  workflow_call:
    secrets:
      LINK_URL:
        required: true
      ORANGEHRM_USERNAME:
        required: true
      ORANGEHRM_PASSWORD:
        required: true

  schedule:
    # 01:00 Asia/Ho_Chi_Minh = 18:00 UTC on the previous day.
    - cron: '00 18 * * *'
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps

      - name: Check environment
      
        run: |
          node -v
          npm -v
          npx playwright --version
          echo "CI=$CI"

      - name: Run Playwright tests
        run: npx playwright test --reporter=list,html
        env:
          CI: true
          LINK_URL: ${{ secrets.LINK_URL }}
          ORANGEHRM_USERNAME: ${{ secrets.ORANGEHRM_USERNAME }}
          ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
